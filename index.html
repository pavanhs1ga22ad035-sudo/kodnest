<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KodNest Neo LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="k">K</span>odNest <small>Neo</small>
      </div>

      <nav class="navlinks">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Courses</a>
        <a href="#">Practice</a>
        <a href="#">Placements</a>
        <a href="#">Community</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn">✉</button>
        <button class="icon-btn">⟳</button>
        <button class="icon-btn">☾</button>
        <button id="profileToggle" class="profile-chip">PH</button>
      </div>
    </header>

    <main class="layout">
      <section class="hero-panel">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p id="heroSubtitle"></p>
        <div class="hero-actions">
          <button id="heroPrimaryBtn" class="btn btn-primary">Continue Learning</button>
          <button id="heroSecondaryBtn" class="btn btn-ghost">View Roadmap</button>
        </div>
      </section>

      <aside class="profile-panel" id="profilePanel">
        <div class="profile-head">
          <div class="avatar" id="profileAvatar">PH</div>
          <div>
            <h2 id="profileName"></h2>
            <p id="profileProgram"></p>
            <span id="profileStatus"></span>
          </div>
        </div>
        <div class="profile-metrics">
          <div>
            <h4 id="profileStreak"></h4>
            <p>Day Streak</p>
          </div>
          <div>
            <h4 id="profilePoints"></h4>
            <p>Total XP</p>
          </div>
        </div>
      </aside>

      <section class="stats-grid" id="quickStats"></section>

      <section class="card large-card">
        <div class="section-head">
          <h3>Upcoming Live Sessions</h3>
          <button class="link-btn">View all</button>
        </div>
        <div id="liveSessions" class="session-list"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <h3>Learning Paths</h3>
        </div>
        <div id="learningPaths" class="path-list"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <h3>Priority Tasks</h3>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </section>

      <section class="card">
        <div class="section-head">
          <h3>Announcements</h3>
        </div>
        <div id="announcements" class="announcement-list"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <h3>Leaderboard</h3>
        </div>
        <ol id="leaderboard" class="leaderboard"></ol>
      </section>
    </main>

    <div id="mobileProfileMenu" class="mobile-profile hidden"></div>

    <script src="script.js"></script>
  </body>
</html>
